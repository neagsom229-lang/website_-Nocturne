services:
  - type: web
    name: bedroom-pop
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    disk:
      name: bedroom-pop-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/bedroom-pop.sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
