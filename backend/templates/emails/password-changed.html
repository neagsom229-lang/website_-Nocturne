<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Password Changed</title></head>
<body style="font-family: sans-serif; background: #0f1117; color: #f3f4f6; padding: 24px;">
  <div style="max-width: 600px; margin: 0 auto; background: #181b22; border-radius: 12px; padding: 32px; border: 1px solid #2a2f3d;">
    <h1 style="color: #a78bfa; font-size: 24px; margin-bottom: 16px;">Password Changed Successfully</h1>
    <p style="color: #9ca3af; line-height: 1.6;">Hello {{displayName}}, your Nocturne account password was recently changed.</p>
    <p style="color: #9ca3af; line-height: 1.6;">If you made this change, you can safely ignore this email. If you did not request this change, please secure your account immediately.</p>
    <a href="{{appUrl}}/auth/signin" style="display: inline-block; background: #8b5cf6; color: #fff; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-top: 16px;">Sign In to Nocturne</a>
  </div>
</body>
</html>
